[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "porthawk"
version = "1.0.0"
description = "A fast, multi-threaded port scanner — a lightweight Nmap alternative"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PortHawk Contributors" }]
requires-python = ">=3.10"
keywords = ["port-scanner", "network", "security", "nmap-alternative", "tcp", "udp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
porthawk = "portscanner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/yourusername/porthawk"
"Bug Tracker" = "https://github.com/yourusername/porthawk/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
