[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "porthawk"
version = "2.0.0"
description = "Fast multi-threaded port scanner - Nmap alternative"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "shivarajp24" }]
requires-python = ">=3.10"
keywords = [
    "port-scanner", "nmap-alternative", "network",
    "security", "vulnerability-scanner", "ethical-hacking"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Security",
]
dependencies = []

[project.scripts]
porthawk = "portscanner.cli:main"

[project.urls]
Homepage = "https://github.com/shivarajp24/porthawk"

[tool.setuptools.packages.find]
where = ["."]
include = ["portscanner*"]
